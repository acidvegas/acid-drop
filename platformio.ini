; ACID DROP - LilyGo T-Deck Plus firmware
; https://github.com/acidvegas/acid-drop
;
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor

[platformio]
default_envs = t-deck-plus
src_dir      = src

[env]
platform         = espressif32@6.11.0
framework        = arduino
board            = esp32-s3-devkitc-1
upload_speed     = 921600
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
; On the S3's native USB-JTAG, DTR and RTS emulate the boot/reset strapping
; pins. Leaving them alone stops the monitor dropping the board into ROM
; download mode every time it attaches.
monitor_dtr      = 0
monitor_rts      = 0
board_build.partitions       = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode       = qio
board_build.f_flash          = 80000000L
board_build.f_cpu            = 240000000L
board_upload.flash_size      = 16MB
board_upload.maximum_size    = 16777216

build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	-Wall
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	; --- LVGL: lv_conf.h lives in include/ ---
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src
	; --- LovyanGFX: build only the ESP32 backend ---
	-DLGFX_USE_V1

lib_deps =
	; Arduino-ESP32 bundled libraries. Listed explicitly because the dependency
	; finder only sees what main.cpp includes, and RadioLib/LovyanGFX need these.
	SPI
	Wire
	FS
	SD
	SPIFFS
	WiFi
	WiFiClientSecure
	Preferences
	ESPmDNS
	Update
	lvgl/lvgl@^9.2.2
	lovyan03/LovyanGFX@^1.2.0
	jgromes/RadioLib@^7.1.2
	mikalhart/TinyGPSPlus@^1.1.0
	bblanchon/ArduinoJson@^7.2.1
	earlephilhower/ESP8266Audio@^1.9.9

lib_ldf_mode = deep+
extra_scripts = pre:tools/pio_extra.py

[env:t-deck-plus]
build_flags =
	${env.build_flags}
	-DACID_BOARD_TDECK_PLUS=1

[env:t-deck]
; Original T-Deck: no on-board GPS module.
build_flags =
	${env.build_flags}
	-DACID_BOARD_TDECK_PLUS=0
